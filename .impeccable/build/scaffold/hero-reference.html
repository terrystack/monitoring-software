<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scaffold reference: procedimiento.jpg</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Biryani:wght@700&display=swap">
  <link rel="stylesheet" href="layout.css">
  <style>html,body{margin:0}body{background:#080918}.region{box-sizing:border-box}.region.text p{white-space:pre-wrap}</style>
</head>
<body>
<!-- Reference only. Every region sits at its measured box inside a comp-aspect frame. Take the boxes (layout.css), keep your own semantic structure. -->
<main class="comp-frame" style="max-width:1280px">
  <div class="r-marca region text" data-region="marca"><!-- AYNI wordmark, tracked uppercase --><p style="font-size:var(--r-marca-font);line-height:1.05;margin:0">marca</p></div>
  <div class="r-pestanas region control" data-region="pestanas"><!-- three tabs Cuerpo 3D (active, cyan underline), Evolución y predicción, Medir y dispositivos: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop pestanas); a control need not have button chrome --></div>
  <div class="r-identidad region text" data-region="identidad"><!-- crew name, mission day and environment in one row --><p style="font-size:var(--r-identidad-font);line-height:1.05;margin:0">identidad</p></div>
  <div class="r-chip-sinteticos region control" data-region="chip-sinteticos"><!-- Datos sintéticos chip, cyan text, outlined: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop chip-sinteticos); a control need not have button chrome --></div>
  <div class="r-campana region control" data-region="campana"><!-- alerts bell with red count badge: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop campana); a control need not have button chrome --></div>
  <div class="r-avatar region control" data-region="avatar"><!-- round crew avatar button that opens the profile panel: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop avatar); a control need not have button chrome --></div>
  <div class="r-barra-borde region chrome" data-region="barra-borde"><!-- hairline under the top bar --></div>
  <div class="r-panel-aptitud region chrome" data-region="panel-aptitud"><!-- dark tinted panel holding Aptitud del día --></div>
  <div class="r-titulo-aptitud region text" data-region="titulo-aptitud"><!-- panel heading Aptitud del día --><p style="font-size:var(--r-titulo-aptitud-font);line-height:1.05;margin:0">titulo-aptitud</p></div>
  <div class="r-filas-aptitud region text" data-region="filas-aptitud"><!-- compact rows with state icon and short value --><p style="font-size:var(--r-filas-aptitud-font);line-height:1.05;margin:0">filas-aptitud</p></div>
  <div class="r-panel-tablero region chrome" data-region="panel-tablero"><!-- dark tinted panel holding the zone status table --></div>
  <div class="r-cabecera-tablero region text" data-region="cabecera-tablero"><!-- table header Zona, Estado, Valor, Tu normal --><p style="font-size:var(--r-cabecera-tablero-font);line-height:1.05;margin:0">cabecera-tablero</p></div>
  <div class="r-filas-tablero region text" data-region="filas-tablero"><!-- 11 numbered zone rows with state icon, value and personal normal --><p style="font-size:var(--r-filas-tablero-font);line-height:1.05;margin:0">filas-tablero</p></div>
  <div class="r-cuerpo-3d region chrome" data-region="cuerpo-3d"><!-- live WebGL anatomical body canvas rendered by the app at runtime, holographic skin, amber heart --></div>
  <div class="r-etiqueta-zona region text" data-region="etiqueta-zona"><!-- floating label Corazón · Atención with warning icon, amber outline --><p style="font-size:var(--r-etiqueta-zona-font);line-height:1.05;margin:0">etiqueta-zona</p></div>
  <div class="r-tarjeta region chrome" data-region="tarjeta"><!-- action card panel, dark tinted, thin border --></div>
  <div class="r-titulo-tarjeta region text" data-region="titulo-tarjeta"><!-- Corazón · Atención heading with amber warning icon --><p style="font-size:var(--r-titulo-tarjeta-font);font-family:var(--r-titulo-tarjeta-family),sans-serif;font-weight:var(--r-titulo-tarjeta-weight);line-height:1.05;margin:0">titulo-tarjeta</p></div>
  <div class="r-que-cambio region text" data-region="que-cambio"><!-- what changed sentence with value, personal normal and onset day --><p style="font-size:var(--r-que-cambio-font);line-height:1.05;margin:0">que-cambio</p></div>
  <div class="r-pasos region control" data-region="pasos"><!-- three numbered steps with checkboxes, first checked: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop pasos); a control need not have button chrome --></div>
  <div class="r-precaucion region text" data-region="precaucion"><!-- PRECAUCIÓN block, amber-tinted border, when to call the flight surgeon --><p style="font-size:var(--r-precaucion-font);line-height:1.05;margin:0">precaucion</p></div>
  <div class="r-por-que region text" data-region="por-que"><!-- Por qué pasa en el espacio line --><p style="font-size:var(--r-por-que-font);line-height:1.05;margin:0">por-que</p></div>
  <div class="r-fuente region text" data-region="fuente"><!-- Fuente: NASA HRP cyan link --><p style="font-size:var(--r-fuente-font);line-height:1.05;margin:0">fuente</p></div>
  <div class="r-botones region control" data-region="botones"><!-- two buttons Ver evolución (outline) and Medir ahora (filled teal): match the control's lettering and visible shape to the crop (comp-spec.mjs --crop botones); a control need not have button chrome --></div>
  <div class="r-pie region text" data-region="pie"><!-- No es un diagnóstico médico footer --><p style="font-size:var(--r-pie-font);line-height:1.05;margin:0">pie</p></div>
</main>
</body>
</html>
